name: Build image

# Builds the bot image on every PR and manual run, and pushes it to ECR as
# telegram-bot/bot only from master (pushes and manual runs on master). Images
# are tagged with the full commit SHA, which is what pie's `pie:telegramBot.image`
# stack config pins, plus the branch name.
#
# No stored AWS keys: the job gets a GitHub OIDC token and assumes
# telegram-bot-ecr-publisher, which pie's pulumi-clusters stack creates
# (pie:githubCiFederation.ecrPublishers). That role trusts only master of this
# repository and can push only to telegram-bot/bot.

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    env:
      PUBLISH_IMAGE: ${{ github.repository == 'Psiphon-Inc/telegram_bot' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write # to request the OIDC token the AWS role trusts
    steps:
      # Psiphon-Inc/github-workflows/setup-ecr does the same, but it lives in a
      # private repo, which a public repo cannot use actions from.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials
        if: env.PUBLISH_IMAGE == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::583352170589:role/telegram-bot-ecr-publisher
          role-session-name: telegram-bot-build-image-${{ github.run_id }}
          aws-region: us-east-2

      - name: Login to ECR
        if: env.PUBLISH_IMAGE == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.ecr.outputs.registry || 'local' }}/telegram-bot/bot
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
